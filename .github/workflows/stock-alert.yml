name: Stock alert

on:
  schedule:
    # Weekdays: alert-only — posts only picks that clear the alert bar, usually nothing.
    # Sunday: the weekly recap and scorecard. Odd minutes dodge the :00/:15/:30 GitHub cron rush;
    # GitHub can still start runs hours late, and notify.py never runs twice in one US day.
    # Times are UTC (ET = UTC-4 in summer, UTC-5 in winter).
    - cron: "37 11 * * 1-5" # pre-market (~7:37 ET): overnight Reddit growth, before the 9:30 ET open
    - cron: "13 21 * * 0" # Sunday: weekend DD threads before Monday
  workflow_dispatch:

jobs:
  notify:
    runs-on: ubuntu-latest
    permissions:
      contents: write # push run history to the `state` branch
      models: read
    steps:
      - uses: actions/checkout@v4

      - name: Check out run history
        uses: actions/checkout@v4
        with:
          ref: state
          path: state

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Reddit alerts and weekly recap
        run: python scripts/notify.py
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SEC_CONTACT_EMAIL: ${{ secrets.SEC_CONTACT_EMAIL }}
          STATE_DIR: state
          # A manual run always runs, even if today's already did.
          FORCE: ${{ github.event_name == 'workflow_dispatch' }}
          YAHOO_USER_AGENT: stock_alert-cron/1.0
          MIN_MENTIONS: "5"
          APEWISDOM_PAGES: "3"
          TOP_N: "5"
          MIN_PRICE: "1"
          ENABLE_RESEARCH: "1"
          RESEARCH_TOP_N: "5"
          RESEARCH_MODEL: "openai/gpt-4o-mini"

      - name: Save run history
        run: scripts/save_state.sh "digest ${{ github.run_id }}"
        env:
          STATE_DIR: state
