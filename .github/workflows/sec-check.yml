name: SEC insider check

on:
  schedule:
    # Every 20 min on odd minutes, 12:13–23:53 UTC on weekdays (≈ 8 AM–8 PM ET in summer, 7 AM–7 PM in winter).
    # Minutes differ from the digest's so the two never start together.
    - cron: "13,33,53 12-23 * * 1-5"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the seen-filings list to the `state` branch
    steps:
      - uses: actions/checkout@v4

      - name: Check out run history
        uses: actions/checkout@v4
        with:
          ref: state
          path: state

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Check EDGAR for insider buys and 8-Ks
        run: python scripts/sec_check.py
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          SEC_CONTACT_EMAIL: ${{ secrets.SEC_CONTACT_EMAIL }}
          STATE_DIR: state
          YAHOO_USER_AGENT: stock_alert-cron/1.0
          SEC_MIN_BUY_USD: "25000"
          SEC_ALERT_USD: "100000"
          MIN_PRICE: "1"

      - name: Save run history
        run: scripts/save_state.sh "sec-check ${{ github.run_id }}"
        env:
          STATE_DIR: state
