name: Put scan

on:
  schedule:
    # 14:47 UTC ≈ 10:47 ET in summer (9:47 in winter): after the opening auction, once option spreads have tightened.
    # GitHub drops or delays most scheduled runs, so later slots are backups: put_scan.py scans once
    # per market day, so the first run after 9:45 ET does the work and the rest exit.
    # Alert-only: posts only when premiums are rich; every scan still records IV history for IV rank.
    - cron: "47 14-19 * * 1-5"
  workflow_dispatch:

# One run at a time: each pushes run history to the `state` branch.
concurrency:
  group: put-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: write # push IV history to the `state` branch
    steps:
      - uses: actions/checkout@v5

      - name: Check out run history
        uses: actions/checkout@v5
        with:
          ref: state
          path: state

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Scan cash-secured puts
        run: python scripts/put_scan.py
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          SEC_CONTACT_EMAIL: ${{ secrets.SEC_CONTACT_EMAIL }} # estimates earnings dates Nasdaq doesn't list yet
          STATE_DIR: state
          # A manual run always scans, even if today's already did.
          FORCE: ${{ github.event_name == 'workflow_dispatch' }}
          YAHOO_USER_AGENT: stock_alert-cron/1.0
          CSP_ANCHORS: "GME"
          # Add comma-separated tickers you'd be happy to own to get ranked picks as well.
          CSP_WATCHLIST: ""
          CSP_TOP_N: "5"
          CSP_MAX_CAPITAL: "3000"
          # Post an anchor's ladder only when IV rank ≥ this (or, until 20 days of IV history exist,
          # implied ≥ CSP_ALERT_IV_EDGE × realized) and a ladder strike pays ≥ CSP_ALERT_MIN_ANNUALIZED %/yr.
          CSP_ALERT_IV_RANK: "50"
          CSP_ALERT_IV_EDGE: "1.3"
          CSP_ALERT_MIN_ANNUALIZED: "30"
          # After posting a ladder, stay quiet this many days unless IV rises this much more.
          CSP_REPOST_DAYS: "7"
          CSP_REPOST_IV_JUMP: "0.05"

      - name: Save run history
        run: scripts/save_state.sh "put-scan ${{ github.run_id }}"
        env:
          STATE_DIR: state
