name: Congress trades

on:
  schedule:
    # Once a weekday evening (22:41 UTC ≈ 6:41 PM ET in summer). The House Clerk refreshes its
    # disclosure index during the day; posts only when new filings contain high-scoring purchases.
    - cron: "41 22 * * 1-5"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the seen-filings list to the `state` branch
    steps:
      - uses: actions/checkout@v4

      - name: Check out run history
        uses: actions/checkout@v4
        with:
          ref: state
          path: state

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Check House trade disclosures
        run: python scripts/congress_check.py
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          SEC_CONTACT_EMAIL: ${{ secrets.SEC_CONTACT_EMAIL }} # company sectors, for committee overlap
          STATE_DIR: state
          YAHOO_USER_AGENT: stock_alert-cron/1.0
          # Purchases scoring at least this are posted (see congress_signals.py for the points).
          CONGRESS_MIN_SCORE: "6"
          # Optional: members whose every stock/option trade is posted regardless of score,
          # comma-separated and matched against the name, e.g. "Pelosi,Gottheimer".
          CONGRESS_WATCH: ""

      - name: Save run history
        run: scripts/save_state.sh "congress-check ${{ github.run_id }}"
        env:
          STATE_DIR: state
