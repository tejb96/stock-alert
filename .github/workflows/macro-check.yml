name: Market alarms

on:
  schedule:
    # Hourly at :27, 13:27–21:27 UTC on weekdays. Alerts are judged on completed daily bars, so only
    # a run after 16:20 New York (20:27 UTC in summer, 21:27 in winter) posts for the day. GitHub
    # drops most scheduled runs; the earlier slots are there to post a close an evening run missed.
    - cron: "27 13-21 * * 1-5"
    # Backup after-close slots, so a dropped 21:27 run doesn't hold a winter close until the next
    # afternoon. A run after the close has been processed does nothing.
    - cron: "27 22,23 * * 1-5"
    # Sunday evening: a second chance at Friday's close.
    - cron: "27 22,23 * * 0"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Print the message in the log instead of posting it, and leave run history unchanged
        type: boolean
        default: false

# One run at a time: each pushes run history to the `state` branch.
concurrency:
  group: macro-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: write # push which alarms are on to the `state` branch
    steps:
      - uses: actions/checkout@v5

      - name: Check out run history
        uses: actions/checkout@v5
        with:
          ref: state
          path: state

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Post what changed at the last close
        run: python scripts/macro_check.py
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DRY_RUN: ${{ inputs.dry_run }}
          STATE_DIR: state
          YAHOO_USER_AGENT: stock_alert-cron/1.0

      - name: Save run history
        if: ${{ !inputs.dry_run }}
        run: scripts/save_state.sh "macro-check ${{ github.run_id }}"
        env:
          STATE_DIR: state
