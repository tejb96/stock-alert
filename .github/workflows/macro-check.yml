name: Market alarms

on:
  schedule:
    # Hourly at :27, 13:27–21:27 UTC on weekdays: US market hours plus the close (summer and winter).
    - cron: "27 13-21 * * 1-5"
    # Sunday evening after FX reopens (21:00 UTC): yen moves over a weekend show up before stocks open.
    - cron: "27 22,23 * * 0"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: write # push which alarms are on to the `state` branch
    steps:
      - uses: actions/checkout@v4

      - name: Check out run history
        uses: actions/checkout@v4
        with:
          ref: state
          path: state

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Check crash alarms and bottom signals
        run: python scripts/macro_check.py
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          STATE_DIR: state
          YAHOO_USER_AGENT: stock_alert-cron/1.0

      - name: Save run history
        run: scripts/save_state.sh "macro-check ${{ github.run_id }}"
        env:
          STATE_DIR: state
